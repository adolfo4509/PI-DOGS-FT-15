name: Build and deploy Node.js app to Azure Web App - pi-dogs-ft-15-237a5b5a

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./PI-Dogs/client
        run: npm install

      - name: Build React App
        working-directory: ./PI-Dogs/client
        env:
          CI: false
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: react-app
          path: ./PI-Dogs/client/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: react-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_19F74EFE1AE64040A05D2ED4AE4B0F34 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_255908838A77418BA035B6AC4E69AC61 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0651F1C24D5B405BB12D4363192C616F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pi-dogs-ft-15-237a5b5a'
          slot-name: 'Production'
          package: .
      
